    <rect x="384" width="174" height="58" rx="29" fill="#53c6a1"/>
    <text x="471" y="38" text-anchor="middle" fill="#143d59">故障與安全</text>
  </g>
  <text x="85" y="520" font-family="Noto Sans TC, sans-serif" font-size="23" font-weight="700" fill="#2878a5">prayer168.github.io/circuit/</text>
  <g transform="translate(700 120)" filter="url(#shadow)">
    <rect width="420" height="390" rx="52" fill="#fff" stroke="#dbe7e5" stroke-width="3"/>
    <path d="M70 285V95H140 M210 95H250 M320 95H350V285H255 M165 285H70" fill="none" stroke="#143d59" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
