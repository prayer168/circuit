<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">電路好好玩</title>
  <desc id="desc">國小四年級互動自然教材社群預覽圖，呈現電池、兩顆燈泡和完整通路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#def7ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="180" fill="#fff3c4" opacity="0.72"/>
  <circle cx="80" cy="590" r="160" fill="#cdeee4" opacity="0.8"/>
  <g transform="translate(82 72)">
    <rect width="70" height="70" rx="22" fill="#fff3c4"/>
    <path d="M25 34a10 10 0 1 1 20 0c0 5-3 8-6 11H31c-3-3-6-6-6-11Z" fill="#ffc94a" stroke="#143d59" stroke-width="4"/>
    <path d="M31 47h8v8h-8z" fill="#143d59"/>
  </g>
  <text x="175" y="113" font-family="Noto Sans TC, sans-serif" font-size="28" font-weight="700" fill="#143d59">國小四年級・自然科學</text>
  <text x="82" y="245" font-family="Noto Sans TC, sans-serif" font-size="76" font-weight="900" letter-spacing="-3" fill="#143d59">電路好好玩</text>
  <text x="85" y="310" font-family="Noto Sans TC, sans-serif" font-size="30" font-weight="500" fill="#5d7185">接通、比較、預測，用觀察證據解開電路任務</text>
  <g transform="translate(82 365)" font-family="Noto Sans TC, sans-serif" font-weight="700" font-size="23">
