    <g transform="translate(285 95)">
      <circle r="38" fill="#ffc94a" stroke="#143d59" stroke-width="8"/>
      <path d="M-17 31h34v28h-34z" fill="#c8d2d1" stroke="#143d59" stroke-width="7"/>
    </g>
    <g transform="translate(210 285)">
